; DSH 隔离版启动器配置（UTF-8）
; AppDir    桌面版主程序所在目录，相对本目录，也可写绝对路径
; Home      隔离版的数据根（DSH_HOME），相对本目录
; Workspace 代码工作目录，相对本目录（在 DSH 里选择工作区时用）
; UserData  Electron 数据目录：
;             electron-data 独立目录（默认；两版可同时开）
;             -            与主版共用（需先完全退出主版，串行启动）
; ExtraArgs 额外启动参数，可留空（例如 --disable-gpu）
AppDir=..\DeepSeekHarness桌面版
Home=home
Workspace=dsh-workspace
UserData=electron-data
ExtraArgs=
